name: Build ESP32-C6 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: ${{ runner.os }}-espidf-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-espidf-

      - name: Install ESP-IDF (v5.2)
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          git clone --depth=1 -b v5.2 https://github.com/espressif/esp-idf.git $HOME/esp-idf
          $HOME/esp-idf/install.sh esp32c6

      - name: Set target and build
        run: |
          . $HOME/esp-idf/export.sh
          idf.py set-target esp32c6
          idf.py build

      - name: Generate flash instructions
        run: |
          cat > FLASH_INSTRUCTIONS.txt << 'EOF'
          ESP32-C6 Firmware Flash Instructions
          =====================================

          Files included:
          - mppt.bin: Main application binary
          - bootloader.bin: ESP32-C6 bootloader
          - partition-table.bin: Partition table
          - flasher_args.json: Flash addresses and arguments

          Method 1: Using idf.py (requires ESP-IDF installed)
          ----------------------------------------------------
          1. Install ESP-IDF v5.2 or later
          2. Extract all files to a directory
          3. Connect your ESP32-C6 board via USB
          4. Run:
             idf.py -p PORT flash

             Replace PORT with your serial port:
             - Linux: /dev/ttyUSB0 or /dev/ttyACM0
             - macOS: /dev/cu.usbserial-*
             - Windows: COM3, COM4, etc.

          Method 2: Using esptool.py (standalone)
          ----------------------------------------
          1. Install esptool:
             pip install esptool

          2. Flash the firmware:
             esptool.py -p PORT -b 460800 --before default_reset --after hard_reset --chip esp32c6 write_flash --flash_mode dio --flash_size detect --flash_freq 80m 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 mppt.bin

             Replace PORT with your serial port (see above).

          3. Monitor serial output (optional):
             idf.py -p PORT monitor
             or
             python -m serial.tools.miniterm PORT 115200

          Method 3: Using flasher_args.json
          ----------------------------------
          If you have ESP-IDF installed, you can use the flasher_args.json file:
          
          1. Extract flasher_args.json and note the flash addresses
          2. Use esptool.py with the addresses from the JSON file

          Troubleshooting:
          ----------------
          - If the board is not detected, install the appropriate USB drivers
          - On Linux, you may need to add your user to the dialout group:
            sudo usermod -a -G dialout $USER
          - Try different baud rates if flashing fails: 115200, 230400, 460800
          - Hold the BOOT button while connecting USB to enter download mode
          - Press RESET button after flashing to restart the device

          For more information, visit:
          https://docs.espressif.com/projects/esp-idf/en/latest/esp32c6/get-started/
          EOF

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-firmware
          path: |
            build/mppt.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            FLASH_INSTRUCTIONS.txt
